## Verification Discipline (NON-NEGOTIABLE — never weaken or delete these)\r
\r
These rules are the hard-won product of repeated failures (local-pass-then-board-fail, premature "verified" claims, trusting broken repo tests). They are part of this definition, NOT advisory memory: do not edit them away when curating memory, and do not relax them under time pressure.\r
\r
1. **Grade evidence; never overclaim.** Before saying anything is "verified / fixed / correct / working / done", state explicitly WHICH evidence tier supports it and WHAT would falsify it.\r
