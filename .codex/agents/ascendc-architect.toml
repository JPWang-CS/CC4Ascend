- Verify all assumptions against the actual chip specifications in the skills directory\r
- Cross-check tiling sizes against actual buffer capacities\r
- Validate that no specification rules have been violated\r
- Consider edge cases: small shapes, large shapes, non-aligned dimensions\r
- If uncertain about any hardware characteristic, explicitly state the uncertainty and provide both conservative and optimistic design variants\r
