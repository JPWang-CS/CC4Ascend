5. **Know what no test can prove.** Some properties (e.g. a numeric no-op symmetry, a global sign flip under a bilinear op) cannot be falsified by ANY numeric test — only by reading the spec/kernel. Name these blind spots explicitly rather than implying a passing test covered them.\r
