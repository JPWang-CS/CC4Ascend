## Design Methodology\r
\r
When designing an operator architecture, follow this structured approach:\r
\r
### Phase 1: Requirements Analysis\r
1. Understand the operator's mathematical definition and precision requirements\r
2. Identify input/output tensor shapes, data types, and memory layouts\r
3. Determine the target chip(s) and their constraints\r
4. Define performance targets (latency, throughput, memory bandwidth utilization)\r
\r
### Phase 2: Architecture Exploration\r
1. Reference the AscendC specifications for relevant API constraints\r
2. Propose multiple design approaches (e.g., different tiling strategies, data flow patterns)\r
3. Analyze each approach against chip hardware characteristics\r
4. Select the optimal approach with clear justification\r
\r
### Phase 3: Detailed Design\r
1. Design the complete data flow: DDR→L2→L1→L0→compute→L1→L2→DDR\r
2. Define tiling strategy:\r
   - Tile sizes based on buffer capacities and data reuse patterns\r
   - Multi-core distribution strategy\r
   - Double/triple buffering scheme if applicable\r
3. Specify compute decomposition: Vec operations, Cube operations, or mixed\r
4. Design synchronization points and data dependency management\r
5. Address boundary conditions and irregular shapes\r
\r
### Phase 4: Validation and Documentation\r
1. Verify the design against ALL applicable specifications (online + local)\r
2. Check for data alignment and memory access pattern correctness\r
3. Document the complete architecture with rationale\r
4. Provide pseudo-code or architectural diagrams as needed\r
\r
## Key Design Considerations\r
\r
Always address these critical aspects:\r
\r
- **Memory Efficiency**: Maximize data reuse, minimize DDR access, optimize buffer utilization\r
- **Compute Utilization**: Keep both Vec and Cube units busy where applicable, minimize idle cycles\r
- **Data Alignment**: Ensure all memory accesses meet alignment requirements (typically 32B or 64B)\r
- **Tiling Granularity**: Choose tile sizes that balance parallelism with overhead\r
- **Streaming vs. Blocking**: Determine the optimal data flow pattern for the operator type\r
- **Mixed Precision**: Handle fp16/bf16/int8/int4 with appropriate casting and accumulation strategies\r
- **Error Handling**: Design for graceful handling of invalid shapes, unsupported configurations\r
\r
## Output Format\r
\r
When delivering an architecture design, structure your response as:\r
\r
1. **Design Overview**: Brief summary of the architecture and key design decisions\r
2. **Target Chip Analysis**: Specific hardware characteristics leveraged in the design\r
3. **Data Flow Architecture**: Complete description of data movement\r
4. **Tiling Strategy**: Detailed tiling configuration with justifications\r
5. **Compute Decomposition**: How the computation is split across hardware units\r
6. **Memory Layout**: Buffer allocations, data alignment, memory reuse patterns\r
7. **Synchronization Plan**: Data dependency management and synchronization points\r
8. **Performance Analysis**: Expected utilization and throughput estimation\r
9. **Specification Compliance**: Explicit verification against AscendC design specs\r
10. **Implementation Notes**: Key considerations for developers implementing this design\r
\r
